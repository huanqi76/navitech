<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Contact | Navitech</title>
  <link rel="icon" href="assets/img/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/tokens.css">
  <link rel="stylesheet" href="assets/css/base.css">
  <link rel="stylesheet" href="assets/css/components.css">
</head>
<body data-page="contact">
  <header id="site-nav"></header>

  <main>
    <section class="page-hero">
      <div class="container page-hero__inner">
        <h1 class="mb-1" data-i18n="contact.h1">Contact</h1>
      </div>
    </section>

    <section class="section section--paper">
      <div class="container">
        <div class="contact-card">
          <ul class="contact-card__list">
            <li class="contact-card__row">
              <span class="contact-card__label" data-i18n="contact.aside.sales">Sales &amp; engineering</span>
              <button type="button" class="contact-card__copy" id="copy-email" data-copy="jiangxin_hu@aliyun.com">
                <span class="text-mono">jiangxin_hu@aliyun.com</span>
                <span class="contact-card__hint" data-i18n="contact.copy">Copy</span>
              </button>
            </li>
            <li class="contact-card__row">
              <span class="contact-card__label" data-i18n="contact.aside.office">Office</span>
              <span class="contact-card__value" data-i18n="contact.aside.addr">Room 203, Building 49, 103 CaoBao Rd, Xuhui District, Shanghai</span>
            </li>
          </ul>
        </div>
      </div>
    </section>
  </main>

  <footer id="site-footer"></footer>

  <script src="assets/js/products-data.js"></script>
  <script src="assets/js/i18n.js"></script>
  <script src="assets/js/contact.js"></script>
  <script src="assets/js/main.js"></script>
  <script>
    I18N.init();
  </script>
</body>
</html>
