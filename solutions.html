<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Solution Offerings | Navitech</title>
  <meta name="description" content="Navitech solutions: cash deposit, dynamic password safedoor locks, and QR code withdrawal &amp; deposit for banks and financial institutions.">
  <link rel="icon" href="assets/img/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/tokens.css">
  <link rel="stylesheet" href="assets/css/base.css">
  <link rel="stylesheet" href="assets/css/components.css">
</head>
<body data-page="solutions">
  <header id="site-nav"></header>

  <main>
    <section class="solution-hero">
      <div class="container solution-hero__inner">
        <h1 class="mb-1" data-i18n="solutions.h1">Solution Offerings</h1>
        <p class="lede" data-i18n="solutions.lede">
          We provide deposit automation, digital fingerprint e-lock, qr-based cash transaction.
        </p>
      </div>
    </section>

    <section class="section section--paper section--solutions">
      <div class="container">
        <div class="solution-grid" id="solution-grid"></div>
      </div>
    </section>
  </main>

  <div class="modal" id="solution-modal" role="dialog" aria-modal="true" aria-labelledby="solution-modal-title" hidden>
    <div class="modal__backdrop" data-modal-close></div>
    <div class="modal__card">
      <button class="modal__close" type="button" data-modal-close aria-label="Close">&times;</button>
      <div class="modal__visual" aria-hidden="true">
        <img src="" alt="">
      </div>
      <div class="modal__body">
        <p class="kicker mb-2" id="solution-modal-kicker"></p>
        <h2 id="solution-modal-title"></h2>
        <p class="modal__detail" id="solution-modal-detail"></p>
        <div class="modal__features">
          <h3 data-i18n="solutions.modal.features">Key features</h3>
          <div id="solution-modal-features"></div>
        </div>
      </div>
    </div>
  </div>

  <footer id="site-footer"></footer>

  <script src="assets/js/products-data.js"></script>
  <script src="assets/js/i18n.js"></script>
  <script src="assets/js/solutions.js"></script>
  <script src="assets/js/main.js"></script>
  <script>
    I18N.init();
  </script>
</body>
</html>
