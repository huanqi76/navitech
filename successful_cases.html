<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Successful Cases</title>
  <meta name="description" content="Four production deployments where Navitech solutions are live: ABA Bank, AMK, BTI, and PLB.">
  <link rel="icon" href="assets/img/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/tokens.css">
  <link rel="stylesheet" href="assets/css/base.css">
  <link rel="stylesheet" href="assets/css/components.css">
</head>
<body data-page="clients">
  <header id="site-nav"></header>

  <main>
    <section class="solution-hero">
      <div class="container solution-hero__inner">
        <h1 data-i18n="clients.h1">Successful Cases</h1>
      </div>
    </section>

    <section class="section section--paper section--cases">
      <div class="container">
        <div class="case-list" id="case-list"></div>
      </div>
    </section>

    <section class="section section--dark">
      <div class="container">
        <div class="section__head">
          <span class="kicker" data-i18n="clients.results.kicker">Track record</span>
          <h2 data-i18n="clients.results.h2">Across the four cases</h2>
        </div>
        <div class="case-stats">
          <div class="case-stats__item">
            <span class="case-stats__value" data-i18n="clients.results.1v">90+</span>
            <span class="case-stats__label" data-i18n="clients.results.1l">Units in service</span>
          </div>
          <div class="case-stats__item">
            <span class="case-stats__value" data-i18n="clients.results.2v">4</span>
            <span class="case-stats__label" data-i18n="clients.results.2l">Institutions</span>
          </div>
          <div class="case-stats__item">
            <span class="case-stats__value" data-i18n="clients.results.3v">99.5%</span>
            <span class="case-stats__label" data-i18n="clients.results.3l">Uptime SLA</span>
          </div>
          <div class="case-stats__item">
            <span class="case-stats__value" data-i18n="clients.results.4v">24/7</span>
            <span class="case-stats__label" data-i18n="clients.results.4l">Remote monitoring</span>
          </div>
        </div>
      </div>
    </section>

    <section class="cta-band">
      <div class="container section" style="padding-block: var(--space-7);">
        <div class="cta-band__inner">
          <a class="btn btn--primary" href="contact.html" data-i18n="clients.cta.btn">Contact us</a>
        </div>
      </div>
    </section>
  </main>

  <footer id="site-footer"></footer>

  <script src="assets/js/products-data.js"></script>
  <script src="assets/js/i18n.js"></script>
  <script src="assets/js/clients.js"></script>
  <script src="assets/js/main.js"></script>
  <script>
    I18N.init();
  </script>
</body>
</html>
